<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Adri - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h1 class="titulo">Banco Adri</h1>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="correo@ejemplo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña">

      <div class="botones">
        <button type="submit" class="btn-iniciar">Iniciar sesión</button>
        <button type="button" id="cancelar" class="btn-cancelar">Cancelar</button>
      </div>

      <p class="registro-texto">¿No tienes cuenta?
        <a href="registro.html" class="link-registro">Regístrate</a>
      </p>
    </form>
  </div>

  <script src="js/cuenta.js"></script>
</body>
</html>
