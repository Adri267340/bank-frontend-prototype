<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Bancaria - Banco Adri</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cuenta-container">
    <h1>Banco Adri 🌸</h1>
    <h2>Bienvenida, <span id="nombreUsuario">Adri</span></h2>

    <div class="info-cuenta">
      <p><strong>Número de cuenta:</strong> <span id="numeroCuenta">12345</span></p>
      <p><strong>Tipo de cuenta:</strong> <span id="tipoCuenta">Ahorros</span></p>
      <p><strong>Saldo disponible:</strong> <span id="saldoCuenta">$2.350.000</span></p>
    </div>

    <div class="botones">
      <button id="verMovimientos">Vermovimientos</button>
      <button id="depositar">Depositar</button>
      <button id="retirar">Retirar</button>
      <button id="agregarMovimiento" class="btn btn-secondary">➕ Agregar movimiento</button>
      <button id="cerrarSesion">Cerrar sesión</button>
    </div>
  </div>

  <script src="js/cuenta.js"></script>
</body>
</html>
