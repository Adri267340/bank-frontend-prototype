<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Adri - Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="registro-body">
  <div class="registro-container">
    <h1 class="titulo">Crear cuenta</h1>
    <form id="registroForm">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Tu nombre completo">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña">

      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" placeholder="Confirma tu contraseña">

      <div class="botones">
        <button type="submit" class="btn-registrar">Registrar</button>
        <button type="button" id="cancelarRegistro" class="btn-cancelar">Cancelar</button>
      </div>

      <p class="registro-texto">¿Ya tienes cuenta?
        <a href="login.html" class="link-registro">Inicia sesión</a>
      </p>
    </form>
  </div>
  <script src="js/registro.js"></script>
</body>
</html>
